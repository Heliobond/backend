services:
  backend:
    build:
      context: .
      target: production
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - PROJECT_REGISTRY_CONTRACT_ID=${PROJECT_REGISTRY_CONTRACT_ID}
      # Keep the V8 heap ceiling under the container memory limit below (#225).
      - NODE_OPTIONS=--max-old-space-size=384
    volumes:
      - ./src:/app/src:ro
    restart: unless-stopped
    # Resource limits (#225). Compose v2 honours deploy.resources outside swarm,
    # so these apply to a plain `docker compose up`.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
