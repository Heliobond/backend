name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for insecure TLS configuration
        run: |
          if [ ! -f src/knexfile.ts ]; then
            echo "::error::src/knexfile.ts not found."
            exit 1
          fi
          if grep -q "rejectUnauthorized: false" src/knexfile.ts; then
            echo "::error::Found insecure TLS configuration (rejectUnauthorized: false) in src/knexfile.ts. Use a proper CA certificate instead."
            exit 1
          fi
          echo "TLS configuration is secure."

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Audit dependencies
        run: bun audit --json || true

      - name: Test
        run: bun run test

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          fail-on: high
